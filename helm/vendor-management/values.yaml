replicaCount: 1

image:
  repository: YOUR_DOCKERHUB_USERNAME
  tag: "latest"
  pullPolicy: Always

backend:
  service:
    type: ClusterIP
    port: 3000

frontend:
  service:
    type: LoadBalancer
    port: 80

database:
  service:
    type: ClusterIP
    port: 27017

env:
  jwtSecret: "your_jwt_secret_here"
